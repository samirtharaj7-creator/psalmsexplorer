<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Psalms Companion | Alternate Design</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #f4f7f5; }
      iframe { display: block; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 180ms ease; }
      iframe.ready { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { iframe { transition: none; } }
    </style>
  </head>
  <body>
    <iframe id="site" src="/" title="Psalms Companion alternate design"></iframe>
    <script>
      const frame = document.getElementById("site");
      frame.addEventListener("load", () => {
        const page = frame.contentDocument;
        if (!page || page.getElementById("alternate-design-styles")) return;
        const stylesheet = page.createElement("link");
        stylesheet.id = "alternate-design-styles";
        stylesheet.rel = "stylesheet";
        stylesheet.href = "/alt-preview.css?v=3";
        stylesheet.addEventListener("load", () => frame.classList.add("ready"));
        stylesheet.addEventListener("error", () => frame.classList.add("ready"));
        page.head.append(stylesheet);
      });
    </script>
  </body>
</html>
